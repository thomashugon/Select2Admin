name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Select2Admin-macOS
          path: build/Select2Admin-macOS.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Select2Admin-macOS.zip
